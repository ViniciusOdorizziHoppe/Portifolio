<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;height:100%}
  body{
    background:#fff;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    display:grid;place-items:center;
    min-height:100vh;min-height:100dvh;
    padding:24px max(20px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
  }

  .cta{
    display:flex;align-items:center;justify-content:center;gap:14px;
    width:100%;max-width:560px;
    padding:30px 26px;
    border:0;border-radius:22px;
    background:linear-gradient(180deg,#16a34a 0%,#0b8043 100%);
    color:#fff;text-decoration:none;
    font-size:clamp(19px,5.2vw,24px);font-weight:900;letter-spacing:-.2px;
    text-transform:uppercase;line-height:1.15;text-align:center;
    box-shadow:0 8px 0 #075e33, 0 18px 34px rgba(11,128,67,.28);
    transition:transform .12s ease, box-shadow .12s ease, filter .12s ease;
    animation:respira 2.6s ease-in-out infinite;
  }
  .cta svg{width:1.55em;height:1.55em;flex:0 0 auto;fill:currentColor}
  .cta:active{
    transform:translateY(6px);
    box-shadow:0 2px 0 #075e33, 0 6px 14px rgba(11,128,67,.22);
    animation:none;
  }
  @media(hover:hover){
    .cta:hover{
      transform:translateY(-2px);filter:brightness(1.05);
      box-shadow:0 10px 0 #075e33, 0 22px 40px rgba(11,128,67,.32);
      animation:none;
    }
  }
  .cta:focus-visible{
    outline:3px solid #f5c518;outline-offset:4px;
  }

  @keyframes respira{
    0%,100%{box-shadow:0 8px 0 #075e33, 0 18px 34px rgba(11,128,67,.28)}
    50%{box-shadow:0 8px 0 #075e33, 0 18px 46px rgba(11,128,67,.44)}
  }
  @media (prefers-reduced-motion: reduce){
    .cta{animation:none;transition:none}
  }
</style>

<body>

<a class="cta" href="https://chat.whatsapp.com/IXJEbgKnQeXFE18fbGiX6I"
   target="_blank" rel="noopener" data-canal="whatsapp"
   aria-label="Entrar no grupo do WhatsApp">
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.32 4.95L2 22l5.25-1.38a9.9 9.9 0 0 0 4.79 1.22h.01c5.46 0 9.91-4.45 9.91-9.91C21.96 6.45 17.5 2 12.04 2zm5.8 14.06c-.24.68-1.4 1.3-1.93 1.35-.53.05-1.03.24-3.47-.72-2.94-1.16-4.8-4.2-4.94-4.4-.14-.19-1.17-1.55-1.17-2.96 0-1.41.58-2.1.79-2.39.2-.29.44-.36.59-.36.15 0 .29 0 .42.01.14.01.32-.05.5.38.18.44.62 1.52.68 1.63.05.11.09.24.01.38-.08.15-.12.24-.24.37-.12.13-.25.29-.36.39-.12.11-.24.23-.1.45.14.22.61 1 1.31 1.62.9.8 1.65 1.05 1.89 1.17.24.12.38.1.52-.06.14-.15.6-.7.76-.94.16-.24.32-.2.53-.12.22.08 1.37.65 1.61.77.24.12.4.18.46.28.06.11.06.62-.16 1.17z"/></svg>
  <span>Entrar no grupo do WhatsApp</span>
</a>

<script>
/* ─────────────────────────────────────────────
   CONFIGURAÇÃO: troque o link aqui se mudar
   ───────────────────────────────────────────── */
const LINKS = {
  whatsapp: 'https://chat.whatsapp.com/IXJEbgKnQeXFE18fbGiX6I'
};

/* Pixel do Meta (opcional). Cole o ID aqui e o evento Lead dispara no clique. */
const PIXEL_ID = '';

const cta = document.querySelector('a.cta');
if (cta && LINKS.whatsapp) cta.href = LINKS.whatsapp;

/* Pixel: carrega só se tiver ID */
if (PIXEL_ID) {
  !(function (f, b, e, v, n, t, s) {
    if (f.fbq) return;
    n = f.fbq = function () { n.callMethod ? n.callMethod.apply(n, arguments) : n.queue.push(arguments); };
    if (!f._fbq) f._fbq = n;
    n.push = n; n.loaded = !0; n.version = '2.0'; n.queue = [];
    t = b.createElement(e); t.async = !0; t.src = v;
    s = b.getElementsByTagName(e)[0]; s.parentNode.insertBefore(t, s);
  })(window, document, 'script', 'https://connect.facebook.net/en_US/fbevents.js');
  fbq('init', PIXEL_ID);
  fbq('track', 'PageView');
}

/* cada clique conta como Lead pra otimizar a campanha */
if (cta) {
  cta.addEventListener('click', function () {
    try { if (window.fbq) fbq('track', 'Lead', { canal: cta.dataset.canal }); } catch (e) {}
  });
}
</script>
